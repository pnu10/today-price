<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!--
    "오늘만 이 가격" 앱 아이콘 600×600

    앱 안에서 1위 상품에 붙는 라임 형광 블록 + 검정 숫자를 그대로 마크로 썼다.
    숫자 1은 폰트가 아니라 패스로 그렸다 — 어느 환경에서 렌더링해도 모양이 같아야 하고,
    앱인토스 콘솔/토스 앱에 어떤 폰트가 있는지 가정할 수 없기 때문.

    플랫폼이 모서리를 알아서 둥글게 깎으므로 전면(full-bleed) 사각형으로 두고,
    마크는 가장자리에서 충분히 떨어뜨려 어떤 마스크가 씌워져도 잘리지 않게 했다.
  -->
  <rect width="600" height="600" fill="#DDFF55"/>

  <!-- 숫자 1 — 깃(flag) + 기둥(stem) + 받침(base) -->
  <g fill="#0C0E14">
    <!-- 오른쪽 끝을 기둥 안쪽(282)까지 밀어넣어, 기둥의 둥근 모서리와 만나는 이음매를 덮는다 -->
    <path d="M282 118 L282 214 L166 214 L166 172 Z"/>
    <rect x="264" y="118" width="76" height="352" rx="6"/>
    <rect x="168" y="430" width="264" height="42" rx="12"/>
  </g>

  <!-- 앱 헤더의 라이브 점과 같은 코랄 악센트 -->
  <circle cx="424" cy="152" r="26" fill="#EE3B24"/>
</svg>
