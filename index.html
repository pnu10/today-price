<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FBFBFC">
<title>오늘만 이 가격 — 토스쇼핑 특가·판매순위</title>
<style>
/* ─────────────────────────────────────────────────────────────
   오늘만 이 가격 — 랭킹 보드 (라이트)
   토큰만 바꾸면 전체 톤이 바뀌도록 색·간격·라운드를 변수로 뺐다.
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#FBFBFC;            /* 캔버스 */
  --surface:#FFFFFF;       /* 카드 */
  --surface2:#F1F3F7;      /* 카드 위의 요소(칩·팩트 등) */
  --line:#E7E9EF;
  --ink:#0C0E14;
  --ink2:#565E6E;
  --ink3:#98A0AE;
  /* 라임은 '칠하는 색'이다 — 흰 배경 위 글자로 쓰면 안 보인다.
     글자·선에는 반드시 --limeInk 를 쓸 것. */
  --lime:#DDFF55;
  --limeInk:#4F8A00;       /* 급상승(글자·그래프) */
  --coral:#EE3B24;         /* 마감 임박·할인율 */
  --sky:#2F6BFF;
  --r:16px;
  --pad:16px;
  --top:calc(env(safe-area-inset-top,0px));
  /* .tabs가 붙을 높이 = .top의 실제 높이. JS가 재서 덮어쓰고, 아래 값은 그 전까지의 기본값 */
  --headH:calc(52px + env(safe-area-inset-top,0px));
  --bot:calc(env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
              "Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.45;letter-spacing:-.02em;
  padding-bottom:calc(24px + var(--bot));
  /* 탭·행을 탭할 때 글자가 선택되는 걸 막는다(모바일에서 특히 거슬린다) */
  -webkit-user-select:none;user-select:none;
}
input,.sheet h3{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hide{display:none!important}

/* ── 상단 바 ───────────────────────────────────────────────── */
/* ⚠️ 스티키 헤더는 배경이 불투명해야 한다. 예전엔 아래쪽이 투명해지는 그라데이션이라
   스크롤하면 상품 목록이 로고·탭을 뚫고 비쳐 보였다.
   그리고 .tabs가 붙는 높이(--headH)는 .top의 실제 높이와 같아야 한다 —
   숫자를 손으로 적어두면 헤더가 조금만 바뀌어도 6px씩 겹친다. 그래서 JS가 재어 넣는다. */
.top{
  position:sticky;top:0;z-index:40;padding:calc(10px + var(--top)) var(--pad) 8px;
  background:var(--bg);
  display:flex;align-items:center;gap:10px;
}
.logo{display:flex;align-items:baseline;font-weight:900;font-size:19px;letter-spacing:-.05em;white-space:nowrap}
/* 흰 배경에선 라임 글자가 안 보이니, 칠해서 대비를 만든다 */
.logo b{background:var(--lime);color:var(--ink);padding:0 6px;border-radius:7px;margin-left:5px}
.logo .live{
  width:6px;height:6px;border-radius:50%;background:var(--coral);align-self:center;margin-left:7px;
  box-shadow:0 0 0 0 rgba(255,91,74,.7);animation:pulse 2.4s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,91,74,.6)}
  70%{box-shadow:0 0 0 7px rgba(255,91,74,0)}
  100%{box-shadow:0 0 0 0 rgba(255,91,74,0)}
}
.top .spacer{flex:1}
.iconbtn{
  width:34px;height:34px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;transition:transform .12s,background .12s;
}
.iconbtn:active{transform:scale(.9)}
.iconbtn.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.iconbtn .cnt{
  position:absolute;transform:translate(13px,-13px);background:var(--coral);color:#fff;
  font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;
  display:grid;place-items:center;padding:0 4px;
}
.stamp{padding:0 var(--pad) 12px;color:var(--ink3);font-size:12px}
.stamp b{color:var(--ink2);font-weight:600}
.stamp .warn{color:var(--coral)}

/* ── 검색 ─────────────────────────────────────────────────── */
.search{padding:0 var(--pad) 12px}
.search .box{
  display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;padding:10px 12px;
}
.search input{
  flex:1;background:none;border:0;outline:none;color:var(--ink);font-size:15px;
}
.search input::placeholder{color:var(--ink3)}

/* ── 탭 ───────────────────────────────────────────────────── */
.tabs{
  position:sticky;top:var(--headH);z-index:39;background:var(--bg);
  padding:2px var(--pad) 0;display:flex;gap:2px;
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
/* 탭 4개가 375px에 다 들어와야 한다 — 넘치면 마지막 '판매순위'가 화면 밖으로 밀려
   있는 줄도 모르게 된다. 그래서 가로 스크롤 대신 4등분해서 꽉 채운다. */
.tabs button{
  position:relative;flex:1;padding:11px 2px 13px;color:var(--ink3);font-weight:700;font-size:13px;
  white-space:nowrap;transition:color .15s;letter-spacing:-.04em;
}
.tabs button .ic{font-size:12px;margin-right:2px}
.tabs button.on{color:var(--ink)}
.tabs button em{
  font-style:normal;font-size:11px;font-weight:800;margin-left:3px;
  color:var(--ink3);font-variant-numeric:tabular-nums;
}
.tabs button.on em{color:var(--limeInk)}
.tabs .ink{
  position:absolute;bottom:-1px;height:3px;background:var(--ink);border-radius:3px;
  transition:transform .26s cubic-bezier(.22,1,.36,1),width .26s cubic-bezier(.22,1,.36,1);
}

/* ── 섹션 헤더 ────────────────────────────────────────────── */
.shd{padding:18px var(--pad) 10px}
.shd h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.035em}
.shd p{margin:4px 0 0;font-size:12.5px;color:var(--ink3)}

/* ── 마감 임박 배너 ───────────────────────────────────────── */
.urgent{
  margin:4px var(--pad) 0;padding:13px 15px;border-radius:var(--r);
  background:linear-gradient(100deg,#FFF1EE,#FFF7F2);border:1px solid #FFDCD4;
  display:flex;align-items:center;gap:12px;
}
.urgent .lab{flex:1;min-width:0}
.urgent .lab .t{font-size:12px;color:#C4321F;font-weight:700}
.urgent .lab .n{
  font-size:13.5px;color:var(--ink2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.urgent .cd{
  font-size:22px;font-weight:900;color:var(--coral);letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}

/* ── 썸네일 ───────────────────────────────────────────────── */
/* 목록은 전부 .grid 카드다. 이 썸네일은 상세 시트에서만 쓴다 */
.th{
  width:66px;height:66px;flex:none;border-radius:13px;overflow:hidden;
  background:var(--surface2);position:relative;
  /* 상품 이미지 상당수가 흰 배경이라, 테두리가 없으면 페이지에 녹아버린다 */
  box-shadow:inset 0 0 0 1px var(--line);
}
.th img{width:100%;height:100%;object-fit:cover}

/* 하루특가 남은 시간 게이지 */
.gauge{margin-top:6px;height:3px;border-radius:2px;background:var(--surface2);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--sky);border-radius:2px;transition:width .5s linear}
.gauge.soon i{background:var(--coral)}

/* ── 카테고리 ─────────────────────────────────────────────── */
/* 카테고리 17개(전체 + 1차 16개)를 가로 스크롤로 두면 뒤쪽이 안 보인다.
   접어서 한눈에 다 보이게 한다 — 스크롤 없이 골라야 탐색이 된다. */
.rail{
  display:flex;flex-wrap:wrap;gap:6px;padding:12px var(--pad) 4px;
}
.rail button{
  flex:none;padding:7px 11px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2);
  transition:transform .12s;
}
.rail button:active{transform:scale(.94)}
.rail button.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}

/* ── 2열 그리드 (검색·찜) ─────────────────────────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px var(--pad) 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;transition:transform .12s}
.card:active{transform:scale(.97)}
.card .ph{position:relative;aspect-ratio:1;background:var(--surface2)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph .tag{
  position:absolute;left:8px;top:8px;background:var(--coral);color:#fff;
  font-size:11px;font-weight:900;padding:3px 7px;border-radius:7px;font-variant-numeric:tabular-nums;
}
.card .bd{padding:10px 11px 12px}
.card .bd .brand{font-size:11px;color:var(--ink3);font-weight:600;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bd .nm{
  font-size:13px;line-height:1.34;color:var(--ink2);height:2.68em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.card .bd .pr{margin-top:6px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
/* 카드 안 가격줄 — 행(.row)과 같은 클래스를 쓰되 폭이 좁아 한 줄에 넣는다 */
.card .bd .pr{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.card .bd .pr .dc{color:var(--coral);font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
.card .bd .pr .won{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.card .bd .pr .orig{font-size:11px;color:var(--ink3);text-decoration:line-through;font-variant-numeric:tabular-nums}
.card .bd .sub{margin-top:4px;font-size:11px;color:var(--ink3);display:flex;gap:5px;align-items:center}
.card .bd .sub .left{font-weight:700;color:var(--sky);font-variant-numeric:tabular-nums}
.card .bd .sub .left.soon{color:var(--coral)}
/* 순위·급상승 배지 — 사진 위 오른쪽 위 */
.card .ph .rk{
  position:absolute;right:8px;top:8px;min-width:24px;height:24px;padding:0 6px;
  border-radius:8px;background:rgba(12,14,20,.62);color:#fff;
  font-size:12.5px;font-weight:900;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;backdrop-filter:blur(4px);
}
.card .ph .rk.top{background:var(--lime);color:var(--ink)}
.card .ph .rk.up{background:var(--limeInk);color:#fff;letter-spacing:0}
.card .ph .rk.new{background:var(--coral);color:#fff;font-size:10.5px;letter-spacing:.02em}
.card .ph .rk.cat{background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(12,14,20,.14);font-size:13px}

/* 순위 추이 — 이 앱의 정체성. 순위는 낮을수록 좋아서 그래프 y축이 뒤집혀 있다.
   ⚠️ 상세 시트의 '가격' 그래프가 이미 .spark를 쓰고 있어서 이름을 나눈다 */
.rspark{display:block}
.rspark polyline{stroke:var(--ink3)}
.rspark circle{fill:var(--ink3)}
.rspark.up polyline{stroke:var(--limeInk)}
.rspark.up circle{fill:var(--limeInk)}
.rspark.down polyline{stroke:var(--ink3)}
.trend{display:flex;align-items:center;gap:6px;margin-top:5px}
.trend .lb{font-size:11px;color:var(--ink3);font-weight:700;white-space:nowrap}
/* 며칠째 상위권인지 — 반짝 등장과 스테디셀러를 구분해준다 */
.streak{
  display:inline-flex;align-items:center;gap:3px;margin-top:5px;padding:2px 7px;border-radius:7px;
  background:var(--surface2);color:var(--ink2);font-size:10.5px;font-weight:800;
}
.streak.long{background:var(--lime);color:var(--ink)}

/* ── 빈 상태 / 스켈레톤 ───────────────────────────────────── */
.empty{padding:52px 28px;text-align:center;color:var(--ink3);font-size:13.5px;line-height:1.7}
.empty .e{font-size:34px;margin-bottom:12px;opacity:.8}
.empty b{color:var(--ink2);display:block;font-size:15px;margin-bottom:6px;font-weight:700}
.sk{padding:8px var(--pad)}
.sk .r{display:flex;gap:12px;padding:11px 0;align-items:center}
.sk .b{border-radius:10px;background:linear-gradient(90deg,#EEF0F4,#F7F8FA,#EEF0F4);
  background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── 상세 시트 ────────────────────────────────────────────── */
.dim{
  position:fixed;inset:0;background:rgba(12,14,20,.45);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:60;backdrop-filter:blur(2px);
}
.dim.on{opacity:1;pointer-events:auto}
/* 시트는 스크롤되는 본문 + 항상 붙어 있는 하단(구매 버튼)으로 나뉜다.
   기기가 작아도 CTA가 화면 밖으로 밀리지 않게 하려는 것. */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);
  border-radius:22px 22px 0 0;transform:translateY(102%);
  transition:transform .32s cubic-bezier(.22,1,.36,1);
  max-height:92vh;max-height:92dvh;
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px;flex:none}
.sheet .x{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;
  background:rgba(12,14,20,.5);color:#fff;display:grid;place-items:center;font-size:15px;z-index:2}
.sheet .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .hero{position:relative;height:min(27vh,240px);background:var(--surface2);border-bottom:1px solid var(--line)}
.sheet .hero img{width:100%;height:100%;object-fit:contain}
.sheet .body{padding:14px var(--pad) 4px}
.sheet .bd2{font-size:12.5px;color:var(--ink3);font-weight:600}
.sheet h3{margin:3px 0 0;font-size:17px;font-weight:700;line-height:1.36;letter-spacing:-.03em}
.sheet .price{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.sheet .price .dc{font-size:23px;font-weight:900;color:var(--coral);font-variant-numeric:tabular-nums}
.sheet .price .won{font-size:25px;font-weight:900;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.sheet .price .orig{font-size:13px;color:var(--ink3);text-decoration:line-through;font-variant-numeric:tabular-nums}
.facts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
/* 3열 그리드로 흘려 담는다. 4개째가 혼자 한 줄을 다 먹지 않게 하려는 것. */
.fact{
  background:var(--surface2);border-radius:11px;padding:9px 12px;
  flex:0 1 calc((100% - 14px) / 3);min-width:0;
}
.fact .k{font-size:11px;color:var(--ink3);font-weight:600}
.fact .v{font-size:14px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.fact .v.up{color:var(--limeInk)}
.fact .v.down{color:var(--ink2)}
.fact .v.hot{color:var(--coral)}
.spark{margin-top:12px;background:var(--surface2);border-radius:13px;padding:12px 14px}
.spark .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink3)}
.spark .hd b{color:var(--ink);font-size:13.5px;font-variant-numeric:tabular-nums}
.spark svg{width:100%;height:46px;margin-top:8px;overflow:visible}
.sheet .foot{
  flex:none;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:calc(10px + var(--bot));
}
.cta{display:flex;gap:9px;padding:12px var(--pad) 0}
.cta .buy{
  flex:1;background:var(--lime);color:var(--ink);font-weight:900;font-size:16px;
  padding:15px;border-radius:14px;text-align:center;transition:transform .12s;
}
.cta .buy:active{transform:scale(.97)}
.cta .buy.off{background:var(--surface2);color:var(--ink3)}
.cta .ic{
  width:52px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:19px;
}
.note{padding:8px var(--pad) 0;font-size:10.5px;color:var(--ink3);line-height:1.5;text-align:center}

/* ── 어제보다 싸진 상품 ───────────────────────────────────── */
/* 급상승 탭 맨 위에 가로로 훑는 줄. 목록을 밀어내지 않으려고 카드보다 작게 만든다. */
.dropRail{
  display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;
  padding:2px var(--pad) 4px;scroll-snap-type:x proximity;
}
.dropRail::-webkit-scrollbar{display:none}
.dropCard{
  flex:none;width:128px;text-align:left;scroll-snap-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;transition:transform .12s;
}
.dropCard:active{transform:scale(.96)}
.dropCard .ph{position:relative;aspect-ratio:1;background:var(--surface2)}
.dropCard .ph img{width:100%;height:100%;object-fit:cover}
.dropCard .pct{
  position:absolute;left:6px;top:6px;background:#127A3E;color:#fff;
  font-size:11px;font-weight:900;padding:3px 6px;border-radius:7px;
  font-variant-numeric:tabular-nums;
}
.dropCard .nm{
  padding:8px 9px 0;font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
/* 좁은 카드라 가격을 가로로 늘어놓으면 "11,240 / 원"으로 끊긴다. 세로로 쌓는다. */
.dropCard .pr{padding:5px 9px 10px}
.dropCard .pr b{
  display:block;font-size:13.5px;font-weight:900;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.dropCard .pr s{
  display:block;font-size:10.5px;color:var(--ink3);margin-top:1px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* 찜 화면 상단 알림 줄 */
.dropNote{
  display:flex;align-items:center;gap:11px;margin:0 var(--pad) 10px;padding:12px 14px;
  background:#EAF7EF;border:1px solid #C7E9D5;border-radius:14px;
}
.dropNote .ic{font-size:19px;flex:none}
.dropNote b{display:block;font-size:13.5px;font-weight:800;color:#0F6B36;letter-spacing:-.02em}
.dropNote span{display:block;font-size:11.5px;color:#3C7A57;font-weight:600;margin-top:2px}

/* ── 상세: 평점 카드 ──────────────────────────────────────── */
.rev{margin-top:12px;background:var(--surface2);border-radius:13px;padding:12px 14px}
.rev .row{display:flex;align-items:center;gap:10px}
.rev .sc{font-size:22px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}

/* ── 토스트 ───────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:calc(28px + var(--bot));transform:translate(-50%,14px);
  background:#15181F;color:#F7F8FA;font-size:13.5px;font-weight:700;
  padding:11px 17px;border-radius:12px;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:80;
  /* 실패 원인처럼 긴 문구도 잘리지 않게 두 줄까지 받는다 */
  max-width:calc(100vw - 40px);text-align:center;line-height:1.4;word-break:break-all;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════
   오늘만 이 가격 (앱인토스 식별자 today-price)
   데이터: sync.py 가 토스쇼핑 쉐어링크 Open API로 만든 catalog.json
   { updatedAt, deltaBaseAt, categories:[{id,name,emoji}], items:[...] }
   ═══════════════════════════════════════════════════════════════ */
const $ = (s) => document.querySelector(s);
const won = (n) => (n || 0).toLocaleString("ko-KR");

/* 배포 후 재빌드 없이 데이터만 갱신하려고 원격 URL을 먼저 본다.
   배치(sync.py)가 하루 한 번 여기로 푸시하므로 앱 재배포 없이 딜이 바뀐다.
   로컬(localhost·file://)에서는 방금 동기화한 같은 폴더 파일을 봐야 하므로 건너뛴다.
   비워두면 항상 같은 폴더의 catalog.json을 쓴다. */
const REMOTE = "https://pnu10.github.io/today-price";
const IS_LOCAL = ["localhost", "127.0.0.1", ""].includes(location.hostname);

let CAT = { items: [], categories: [] };
let PRICES = {};
let tab = "today";
let curCat = 0;
let curQ = "";
let todayFreshOnly = false;                       // 하루특가: 오늘 처음 뜬 것만 볼지
let cur = null;                                   // 시트에 열려 있는 상품
let saved = JSON.parse(localStorage.getItem("dealrank.saved") || "[]");

/* ── 유틸 ──────────────────────────────────────────────────── */
// 하루특가는 endAt이 지나면 토스에서 판매가 끝난다. catalog.json은 동기화 때만 갱신되므로
// 만료된 게 남아 있을 수 있어 화면에서 한 번 더 걸러낸다(가격이 이미 달라져 있다).
const isLive = (d) => !d.endAt || new Date(d.endAt).getTime() > Date.now();
const msLeft = (d) => new Date(d.endAt).getTime() - Date.now();

function hhmmss(ms) {
  if (ms <= 0) return "종료";
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`
           : `${m}:${String(ss).padStart(2, "0")}`;
}
function agoLabel(iso) {
  if (!iso) return "";
  const days = Math.round((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days >= 1) return `${days}일 전 대비`;
  const h = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 3600000));
  return `${h}시간 전 대비`;
}
function esc(s) {
  return String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("on"), 1900);
}

/* ── 목록 셀렉터 ───────────────────────────────────────────── */
const live = () => CAT.items.filter(isLive);
const listToday  = () => live().filter((d) => d.endAt).sort((a, b) => msLeft(a) - msLeft(b));
const listBest   = () => live().filter((d) => d.bestRank).sort((a, b) => a.bestRank - b.bestRank);
// 급상승: 순위가 오른 것 우선, 그다음 신규 진입(어제 랭킹에 없던 상품)
const listRising = () => live()
  .filter((d) => (d.rankDelta || 0) > 0 || d.isNew)
  .sort((a, b) => (b.rankDelta || 0) - (a.rankDelta || 0) || a.bestRank - b.bestRank);
const listCat = () => {
  const l = live().filter((d) => d.catId && (!curCat || d.catId === curCat));
  return l.sort((a, b) => (a.catRank || 999) - (b.catRank || 999) || b.dc - a.dc);
};
const listSaved = () => CAT.items.filter((d) => saved.includes(d.id));

/* ── 조각 렌더러 ───────────────────────────────────────────── */
function priceLine(d) {
  return `<div class="pr">
    ${d.dc > 0 ? `<span class="dc">${d.dc}%</span>` : ""}
    <span class="won">${won(d.price)}원</span>
    ${d.dc > 0 ? `<span class="orig">${won(d.orig)}원</span>` : ""}
  </div>`;
}
function reviewLine(d) {
  if (!d.reviews) return "";
  return `<div class="sub">⭐ ${(d.score || 0).toFixed(1)} · 리뷰 ${won(d.reviews)}</div>`;
}

// 순위가 있는 상품에는 추이 그래프와 "며칠째"를 붙인다 — 다른 앱이 못 만드는 정보다
function trendLine(d, label) {
  const sp = sparkline(d, 44, 16);
  if (!sp) return "";
  return `<div class="trend">${sp}<span class="lb">${label}</span></div>`;
}

function streakChip(d) {
  const n = rankStreakDays(d);
  if (n < 2) return "";
  return `<div class="streak ${n >= 4 ? "long" : ""}">🔥 ${n}일째 100위 안</div>`;
}

function cardBest(d, i) {
  return cardOf(d, {
    ...rankBadge(d.bestRank || i + 1),
    sub: trendLine(d, "순위 추이") || streakChip(d) || reviewLine(d),
  });
}

function cardRising(d) {
  const up = d.rankDelta > 0;
  return cardOf(d, {
    badge: up ? `▲${d.rankDelta}` : "NEW",
    badgeCls: up ? "up" : "new",
    sub: (trendLine(d, d.bestRank ? `현재 ${d.bestRank}위` : "순위 추이")
      || `<div class="sub">${d.bestRank ? `현재 ${d.bestRank}위` : "새로 진입"}</div>`) + streakChip(d),
  });
}

// 토스 1차 카테고리명은 칩에 쓰기엔 길다("패션의류잡화"). 칩에서만 줄여 쓰고,
// 섹션 헤더("패션의류잡화 판매순위")에는 원래 이름을 그대로 둔다.
const CAT_SHORT = {
  "패션의류잡화": "패션", "출산/유아동": "출산육아", "가전/디지털": "가전",
  "반려/애완용품": "반려", "스포츠/레져": "스포츠", "가구/홈데코": "홈데코",
  "문구/오피스": "문구", "음반/DVD": "음반", "완구/취미": "완구",
  "여행/취미": "여행", "자동차용품": "자동차", "주방용품": "주방", "생활용품": "생활",
};
const shortCat = (n) => CAT_SHORT[n] || n;

// 판매순위의 catRank는 "그 카테고리 안에서의 순위"다. '전체'로 보면 16개 카테고리의
// 1위가 나란히 놓여 순위 배지가 온통 1이 된다. 그래서 전체에서는 순위 대신
// 어느 카테고리의 몇 위인지를 보여주고, 카테고리를 고르면 그때 순위 숫자를 쓴다.
function cardCat(d, i, cats) {
  const c = cats.find((x) => x.id === d.catId) || {};
  const rank = d.catRank || i + 1;
  if (curCat) return cardOf(d, { ...rankBadge(rank), sub: reviewLine(d) });
  return cardOf(d, {
    badge: c.emoji || "🛍️",
    badgeCls: "cat",
    sub: `<div class="sub">${esc(c.name || "")} ${rank}위</div>`,
  });
}

// 하루특가는 보통 그날 자정에 다 같이 끝나서 endAt이 전부 같다.
// 그럴 땐 카드마다 똑같은 카운트다운을 85번 찍는 게 소음이라 상단 배너 하나로만 보여주고,
// 마감 시각이 제각각인 날에만 카드에도 남은 시간을 붙인다.
function cardToday(d, i, showTimer) {
  const left = msLeft(d);
  const soon = left < 2 * 3600 * 1000;
  return cardOf(d, {
    ...rankBadge(i + 1),
    end: d.endAt,
    sub: showTimer
      ? `<div class="sub"><span class="left ${soon ? "soon" : ""} num" data-cd>${hhmmss(left)}</span> 남음</div>`
      : reviewLine(d),
  });
}

/* ── 이미지 지연 로딩 (2026-09-16) ─────────────────────────────
   상품 사진이 장당 0.8~3.3MB짜리 1024px PNG이고(토스 CDN은 ?w= 같은 리사이즈를 안 받는다),
   목록을 한 번에 다 그려서 첫 화면에 수십~백 MB를 받고 있었다.
   하루특가 앱과 같은 방식: 첫 화면 몫(EAGER_N)만 바로 받고, 나머지는 화면 가까이 올 때 받는다. */
const EAGER_N = 6;
let imgSeq = 0;
function resetImgSeq() { imgSeq = 0; }
function imgTag(d) {
  const eager = imgSeq++ < EAGER_N;
  return `<img decoding="async"${eager ? "" : ' loading="lazy"'} ` +
    `${eager ? "src" : "data-src"}="${esc(d.img)}" alt="" onerror="this.style.visibility='hidden'">`;
}
let imgObserver = null;
function observeImages() {
  if (!("IntersectionObserver" in window)) {      // 아주 옛 브라우저 — 그냥 다 채운다
    document.querySelectorAll("img[data-src]").forEach((i) => { i.src = i.dataset.src; delete i.dataset.src; });
    return;
  }
  if (!imgObserver) {
    imgObserver = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        const img = e.target;
        // 아직 화면에 안 보이는(크기 0) 요소는 위치가 0,0 으로 잡혀 '보인다'로 오판된다 → 건너뛰고 계속 관찰
        if (!e.boundingClientRect.width && !e.boundingClientRect.height) continue;
        if (img.dataset.src) { img.src = img.dataset.src; delete img.dataset.src; }
        imgObserver.unobserve(img);
      }
    }, { rootMargin: "700px 700px" });            // 한 화면쯤 미리 받아 스크롤이 끊기지 않게 (가로 목록도)
  }
  document.querySelectorAll("img[data-src]").forEach((i) => imgObserver.observe(i));
}
/* 보조 장치 — 탭이 백그라운드였다가 돌아오는 등 관찰자가 못 돌 때도 스크롤하면 근처 것은 받는다.
   src 를 채우면서 data-src 를 지우므로 관찰자와 겹쳐도 두 번 받지 않는다. */
function fillNearby() {
  const lim = innerHeight + 700;
  for (const img of document.querySelectorAll("img[data-src]")) {
    const r = img.getBoundingClientRect();
    if (!r.width && !r.height) continue;            // 안 보이는 상태(크기 0)면 전부 '근처'로 오판하므로 건너뜀 (2026-09-16 첫 화면 66장 전부 받음)
    if (r.bottom > -700 && r.top < lim && r.right > -700 && r.left < innerWidth + 700) { img.src = img.dataset.src; delete img.dataset.src; }
  }
}
let fillT = null;
addEventListener("scroll", () => {
  if (fillT) return;
  fillT = setTimeout(() => { fillT = null; fillNearby(); }, 150);
}, { passive: true });

// 목록은 전부 이 카드 하나로 그린다(한 화면에 2×2).
// opts.badge  — 사진 위 오른쪽 배지: 순위 숫자 / ▲N / NEW
// opts.sub    — 가격 아래 한 줄: 남은 시간이나 리뷰
function cardOf(d, opts) {
  const o = opts || {};
  const badge = o.badge
    ? `<span class="rk ${o.badgeCls || ""} num">${o.badge}</span>` : "";
  return `<div class="card" onclick="openSheet('${d.id}')"${o.end ? ` data-end="${esc(o.end)}"` : ""}>
    <div class="ph">${d.img ? imgTag(d) : ""}
      ${d.dc > 0 ? `<span class="tag num">${d.dc}%</span>` : ""}${badge}</div>
    <div class="bd">
      ${d.brand ? `<div class="brand">${esc(d.brand)}</div>` : ""}
      <div class="nm">${esc(d.name)}</div>
      ${priceLine(d)}
      ${o.sub || ""}
    </div>
  </div>`;
}

// 순위 배지: 1~3위만 라임색으로 눈에 띄게
const rankBadge = (n) => ({ badge: n, badgeCls: n <= 3 ? "top" : "" });

/* 가격 기록으로 읽어내는 두 가지 ─────────────────────────────
   기록은 하루 한 번 append 되므로, 남아 있는 날짜를 세면 그 상품을 언제부터
   봤는지 알 수 있다. 별도 데이터 없이 "오늘 처음"과 "어제보다 싸짐"이 나온다. */
function dealDays(d) {
  const h = PRICES[d.id] || [];
  return new Set(h.map((x) => x.d)).size;
}
// 기록된 날짜가 하루뿐이면 오늘 처음 잡힌 상품이다(타임존을 안 타는 판정).
function isFreshDeal(d) { return dealDays(d) <= 1; }

function priceDrop(d) {
  const h = PRICES[d.id] || [];
  if (h.length < 2) return null;
  const now = h[h.length - 1].p, before = h[h.length - 2].p;
  if (now >= before) return null;
  return { before, now, pct: Math.round(((now - before) / before) * 100) };
}
const listDropped = () => live()
  .map((d) => ({ d, drop: priceDrop(d) }))
  .filter((x) => x.drop)
  .sort((a, b) => a.drop.pct - b.drop.pct);

function emptyBox(title, desc, emoji) {
  return `<div class="empty"><div class="e">${emoji}</div><b>${title}</b>${desc}</div>`;
}

/* ── 뷰 ────────────────────────────────────────────────────── */
function renderView() {
  const v = $("#view");

  if (curQ) {
    const q = curQ.toLowerCase();
    const hit = live().filter((d) =>
      (`${d.name} ${d.brand} ${d.cat}`).toLowerCase().includes(q));
    v.innerHTML = `<div class="shd"><h2>'${esc(curQ)}' 검색결과 ${hit.length}건</h2></div>` +
      (hit.length ? `<div class="grid">${hit.map(cardOf).join("")}</div>`
                  : emptyBox("찾는 상품이 없어요", "다른 검색어로 찾아보세요.", "🔍"));
    return;
  }

  if (tab === "saved") {
    const mine = listSaved();
    const save = mine.reduce((s, d) => s + (d.orig - d.price), 0);
    // 찜해 둔 사이 값이 내린 게 있으면 그걸 먼저 알린다 — 다시 들어올 이유가 된다

    // 하루특가는 매일 대부분 갈린다. 어제도 있던 걸 걸러내면 매일 오는 사람이
    // 새로 볼 것만 추릴 수 있다.

      ${freshAll.length && freshAll.length < l.length ? `<div class="rail">
        <button class="${todayFreshOnly ? "" : "on"}" onclick="setFreshOnly(false)">전체 ${l.length}</button>
        <button class="${todayFreshOnly ? "on" : ""}" onclick="setFreshOnly(true)">✨ 새로 뜬 것만 ${freshAll.length}</button>
      </div>` : ""}
      ${rows.length ? `<div class="grid">${rows.map((d, i) => cardToday(d, i, many)).join("")}</div>`
        : emptyBox("새로 뜬 특가가 없어요", "오늘은 어제 있던 특가가 이어지고 있어요.", "✨")}`;
    return;
  }

  if (tab === "best") {
    const l = listBest();
    v.innerHTML = `<div class="shd"><h2>지금 많이 팔려요</h2>
        <p>토스쇼핑 판매 랭킹 · 그래프는 최근 ${RANK_DAYS.length}번 기록한 순위 흐름</p></div>
      <div class="grid">${l.map(cardBest).join("")}</div>`;
    return;
  }

  if (tab === "rising") {
    const l = listRising();
    if (!l.length) {
      v.innerHTML = emptyBox("아직 순위 변동을 집계하는 중이에요",
        "급상승은 판매 랭킹을 이전 기록과 비교해서 만들어요.<br>동기화가 두 번 쌓이면 나타나요.", "🚀");
      return;
    }
    const up = l.filter((d) => d.rankDelta > 0).length;

    const bits = [up ? `순위 상승 ${up}개` : "", fresh ? `신규 진입 ${fresh}개` : ""].filter(Boolean);
    const dropped = listDropped();
    v.innerHTML = (dropped.length ? `
      <div class="shd"><h2>어제보다 싸졌어요</h2>
        <p>가격을 매일 기록해 두고 어제 값과 비교했어요 · ${dropped.length}개</p></div>
      <div class="dropRail">${dropped.slice(0, 12).map(({ d, drop }, i) => `
        <button class="dropCard" onclick="openSheet('${d.id}')">
          <div class="ph">${d.img ? imgTag(d) : ""}
            <span class="pct">${drop.pct}%</span></div>
          <div class="nm">${esc(d.name)}</div>
          <div class="pr"><b>${won(drop.now)}원</b><s>${won(drop.before)}원</s></div>
        </button>`).join("")}</div>` : "") +
      `<div class="shd"><h2>인기급상승</h2>
        <p>${agoLabel(CAT.deltaBaseAt) || "이전 집계 대비"} · ${bits.join(" · ")}<br>
        순위를 매일 기록해 두고 어제와 비교해서 만든 목록이에요</p></div>
      <div class="grid">${l.map(cardRising).join("")}</div>`;
    return;
  }

  // 카테고리
  const cats = CAT.categories || [];
  const l = listCat();
  v.innerHTML = `
    <div class="rail">
      <button class="${curCat ? "" : "on"}" onclick="setCat(0)">전체</button>
      ${cats.map((c) => `<button class="${curCat === c.id ? "on" : ""}" onclick="setCat(${c.id})">${c.emoji} ${esc(shortCat(c.name))}</button>`).join("")}
    </div>
    <div class="shd"><h2>${curCat ? `${esc((cats.find((c) => c.id === curCat) || {}).name)} 판매순위` : "판매순위"}</h2>
      <p>카테고리별 판매 순위 · ${l.length}개</p></div>` +
    (l.length ? `<div class="grid">${l.map((d, i) => cardCat(d, i, cats)).join("")}</div>`
              : emptyBox("이 카테고리는 아직 비어 있어요", "동기화를 한 번 더 돌려주세요.", "📊"));

/* ── 상세 시트 ─────────────────────────────────────────────── */
function lowest(d) {
  const h = PRICES[d.id];
  if (!h || h.length < 2) return null;
  const ps = h.map((x) => x.p);
  const min = Math.min(...ps), max = Math.max(...ps);
  return { min, max, flat: min === max, days: h.length, isLow: d.price <= min, points: h.slice(-14) };
}
function sparkSvg(pts) {
  if (!pts || pts.length < 2) return "";
  const ps = pts.map((x) => x.p);
  const min = Math.min(...ps), max = Math.max(...ps);
  const span = max - min;
  const W = 100, H = 40;
  // 값이 계속 같으면 span이 0이라 선이 바닥에 붙는다 → 가운데 수평선으로 그린다
  const yOf = (p) => (span ? H - ((p - min) / span) * H : H / 2);
  const d = pts.map((x, i) =>
    `${i ? "L" : "M"}${((i / (pts.length - 1)) * W).toFixed(1)},${yOf(x.p).toFixed(1)}`).join(" ");
  const lastY = yOf(ps[ps.length - 1]);
  // 끝점 원과 선 굵기가 잘리지 않게 viewBox에 여백을 준다
  return `<svg viewBox="-3 -4 ${W + 7} ${H + 8}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="var(--limeInk)" stroke-width="2" vector-effect="non-scaling-stroke"
      stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${W}" cy="${lastY.toFixed(1)}" r="2.5" fill="var(--limeInk)" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

/* 특가 알림 신청 + 리워드 ──────────────────────────────────────
   알림 동의 화면(토스 5.255.0+)을 띄우고, 동의를 받으면 프로모션 리워드를 지급한다.
   동의와 지급은 별개 API라 "동의는 됐는데 지급이 실패"할 수 있다. 그래서 두 상태를
   따로 저장해 두고, 그 경우 배너를 남겨서 지급만 다시 시도하게 한다.

   ⚠️ TEMPLATE_CODE는 토스 콘솔의 스마트발송 템플릿 코드로, 프로모션 코드와는 다른 값이다.
      비어 있으면 알림 신청이 동작하지 않는다. */
const NOTI_TEMPLATE_CODE = "today-price-deal-alert2";   // 콘솔 스마트발송 발송 코드
const NOTI_PROMO_CODE = "01M0TYW614AGP2X9ZHT0D0H6Q6";           // 운영 프로모션 코드 — 실제 지급됨
const NOTI_REWARD = 4;

const NOTI_MAX_TRIES = 3;
let notiAgreed = localStorage.getItem("dealrank.notiAgreed") === "1";
let notiRewarded = localStorage.getItem("dealrank.notiRewarded") === "1";
let notiTries = Number(localStorage.getItem("dealrank.notiTries") || 0);
let notiBusy = false;

function notiSupported() {
  // templateCode가 없으면 눌러도 신청이 안 된다. 4원을 준다고 띄워놓고 못 주는 게
  // 제일 나쁘므로, 값이 채워지기 전에는 배너 자체를 내보내지 않는다.
  return !!NOTI_TEMPLATE_CODE && typeof window.__tossRequestNotiAgreement === "function";
}
function paintNoti() {
  const card = $("#notiCard");
  if (!card) return;
  // 리워드까지 끝났으면 배너를 접는다. 토스 밖에서는 신청 자체가 불가능해 띄우지 않는다.
  const show = !notiRewarded && (notiSupported() || location.search.includes("notiDemo=1"));
  card.classList.toggle("hide", !show);
  if (!show) return;

  if (notiAgreed) {
    // 동의는 받았는데 지급이 안 끝난 상태 — 지급만 다시 시도하면 된다
    card.classList.add("done");
    $("#notiSub").textContent = "알림은 켜졌어요. 4원을 받아가세요";
    $("#notiBtn").textContent = "4원 받기";
  } else {
    card.classList.remove("done");
    $("#notiSub").textContent = `알림 신청하면 ${NOTI_REWARD}원을 드려요`;
    $("#notiBtn").textContent = `신청하고 ${NOTI_REWARD}원`;
  }
  $("#notiBtn").disabled = notiBusy;
}

function markRewarded() {
  notiRewarded = true;
  localStorage.setItem("dealrank.notiRewarded", "1");
}
/* 지급 실패가 "이미 받았다"인지 "이번에 안 됐다"인지 구분한다.
   전자면 배너를 접어야 하고(계속 띄우면 영영 못 받는 버튼이 남는다),
   후자면 남겨서 다시 시도하게 해야 한다. 서버 에러 코드 문자열은 콘솔이 정하므로
   정확한 값을 모른 채로 패턴을 넓게 잡는다. */
function isAlreadyRewarded(code) {
  return /ALREADY|DUPLICAT|EXCEED|LIMIT|EXHAUST|COMPLETED/i.test(String(code || ""));
}
async function grantNotiReward() {
  if (notiRewarded) return;            // 지급은 한 번뿐 — 호출 경로가 늘어나도 여기서 막힌다
  const grant = window.__tossGrantReward;
  if (typeof grant !== "function") { toast("알림을 신청했어요 🔔"); return; }
  try {
    await grant({ promotionCode: NOTI_PROMO_CODE, amount: NOTI_REWARD });
    markRewarded();
    toast(`알림 신청 완료! ${NOTI_REWARD}원을 받았어요 🎉`);
  } catch (e) {
    const code = (e && e.code) || "";
    console.warn("[reward] 지급 실패:", code, e && e.message);
    if (isAlreadyRewarded(code)) { markRewarded(); toast("알림을 신청했어요 🔔"); return; }

    // 모르는 실패는 몇 번만 더 시도하고 접는다. 무한히 남겨두면 눌러도 안 되는 버튼이 된다.
    notiTries += 1;
    localStorage.setItem("dealrank.notiTries", String(notiTries));
    if (notiTries >= NOTI_MAX_TRIES) { markRewarded(); toast("알림을 신청했어요 🔔"); return; }
    toast("알림은 켜졌어요. 잠시 후 다시 눌러주세요");
  }
}

function markAgreed() {
  notiAgreed = true;
  localStorage.setItem("dealrank.notiAgreed", "1");
}

async function requestNoti() {
  if (notiBusy || notiRewarded) return;
  const req = window.__tossRequestNotiAgreement;

  // 지급만 남은 상태면 동의 화면을 다시 띄우지 않는다
  if (notiAgreed) {
    notiBusy = true; paintNoti();
    await grantNotiReward();
    notiBusy = false; paintNoti();
    return;
  }
  if (typeof req !== "function") { toast("토스 앱에서 신청할 수 있어요"); return; }
  if (!NOTI_TEMPLATE_CODE) { toast("알림 설정이 준비 중이에요"); return; }

  notiBusy = true; paintNoti();

  // onEvent가 동기로 불릴 수 있어 cleanup이 아직 없을 때를 대비한다
  let cleanup = null, wantsCleanup = false;
  const release = () => {
    if (typeof cleanup === "function") { cleanup(); cleanup = null; }
    else wantsCleanup = true;
  };
  const finish = () => { notiBusy = false; paintNoti(); };

  try {
    cleanup = req({
      options: { templateCode: NOTI_TEMPLATE_CODE },
      onEvent: async ({ type }) => {
        release();
        if (type === "agreementRejected") { finish(); return; }
        markAgreed();                       // newAgreement | alreadyAgreed
        await grantNotiReward();
        finish();
      },
      onError: (e) => { release(); failNoti(e); finish(); },
    });
    if (wantsCleanup && typeof cleanup === "function") { cleanup(); cleanup = null; }
  } catch (e) {
    failNoti(e);
    finish();
  }
}

/* 실패 원인을 화면에 드러낸다.
   앱인토스 웹뷰는 콘솔을 들여다보기 어려워서, 원인을 삼키면 발송 코드가 틀린 건지
   동의문이 승인 전인 건지 구분할 방법이 없다. NOTI_DEBUG를 끄면 일반 문구만 나간다. */
const NOTI_DEBUG = false;
function failNoti(e) {
  let detail = "";
  try {
    if (e) {
      detail = e.code || e.errorCode || e.name || e.message ||
        (typeof e === "string" ? e : JSON.stringify(e));
    }
  } catch (_) { detail = String(e); }
  console.warn("[noti] 동의 요청 실패:", detail, e);
  toast(NOTI_DEBUG && detail
    ? `알림 신청 실패: ${String(detail).slice(0, 70)}`
    : "알림 신청에 실패했어요");
}

/* 미니앱 리뷰 요청 ────────────────────────────────────────────
   서로 다른 상품 2개를 열어보면 리뷰 시트를 띄운다. 같은 상품을 여러 번 열거나
   찜·구매를 겹쳐 해도 1개로만 센다(id 집합).

   ⚠️ 토스 SDK는 사용자가 실제로 리뷰를 남겼는지 알려주지 않는다(반환값이 void).
      그래서 "아직 안 쓴 사람에게만"을 앱이 판별할 방법이 없다. 대신 앱을 켤 때마다
      한 번씩 다시 물을 수 있게 두고(세션당 1회), 실제 노출 여부는 토스·OS 정책에 맡긴다.
      영구 1회로 막아두면 한 번 놓친 사람에게는 영영 기회가 없다.
   토스 밖(로컬·정적 호스팅)에서는 __tossRequestReview가 없어 아무 일도 일어나지 않는다. */
const REVIEW_AFTER = 2;
let reviewAskedThisSession = false;                // 앱을 다시 켜면 초기화된다
let actedIds = JSON.parse(localStorage.getItem("dealrank.acted") || "[]");
let leftForShopping = false;

function noteAction(id) {
  if (actedIds.includes(id)) return;
  actedIds.push(id);
  localStorage.setItem("dealrank.acted", JSON.stringify(actedIds));
}
let reviewCalls = 0, reviewLast = "-";
function maybeAskReview() {
  if (reviewAskedThisSession || actedIds.length < REVIEW_AFTER) return;
  if (typeof window.__tossRequestReview !== "function") { reviewLast = "API없음"; return; }
  reviewAskedThisSession = true;
  // 시트가 닫히는 애니메이션(.32s)이 끝난 뒤에 띄워야 두 시트가 겹치지 않는다.
  setTimeout(() => {
    reviewCalls += 1;
    window.__tossRequestReview()
      .then(() => { reviewLast = "ok"; })
      .catch((e) => {
        reviewLast = "err:" + ((e && (e.code || e.name || e.message)) || "?");
        console.warn("[review] 실패:", e);
      });
  }, 420);
}

/* 숨은 진단 — 로고를 5번 연달아 누르면 SDK 연결 상태를 토스트로 보여준다.
   앱인토스 웹뷰는 콘솔을 볼 수 없어서, 기능이 안 될 때 원인을 좁힐 방법이 없다. */
let logoTaps = 0, logoTimer = null;
function tapLogo() {
  logoTaps += 1;
  clearTimeout(logoTimer);
  logoTimer = setTimeout(() => { logoTaps = 0; }, 1500);
  if (logoTaps < 5) return;
  logoTaps = 0;
  const has = (f) => (typeof window[f] === "function" ? "O" : "X");
  toast([
    `리뷰${has("__tossRequestReview")}`,
    `알림${has("__tossRequestNotiAgreement")}`,
    `지급${has("__tossGrantReward")}`,
    `열람 ${actedIds.length}/${REVIEW_AFTER}`,
    `호출 ${reviewCalls}`,
    reviewLast,
  ].join(" · "));
}
// 토스쇼핑으로 나간 사람에게는 그 자리에서 물을 수 없다. 앱으로 돌아왔을 때 묻는다.
document.addEventListener("visibilitychange", () => { if (!document.hidden) fillNearby(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !leftForShopping) return;
  leftForShopping = false;
  setTimeout(maybeAskReview, 800);
});

/* 평점 카드 ───────────────────────────────────────────────────
   토스쇼핑 API는 리뷰 본문을 주지 않는다(평점·리뷰수뿐). 그래서 본문 대신
   "이 목록 안에서 어느 위치인가"를 계산해 붙인다. 카탈로그 전체가 이미 손에
   있으니 별도 호출 없이 정직하게 셀 수 있다.
   비교 모수는 리뷰 30개 이상인 상품만 — 리뷰 3개짜리 만점과 섞으면 순위가 무의미해진다. */
let scorePool = null;
function ratingPool() {
  if (scorePool) return scorePool;
  scorePool = (CAT.items || []).filter((x) => (x.reviews || 0) >= 30 && (x.score || 0) > 0);
  return scorePool;
}
function ratingCard(d) {
  if (!d.reviews || !d.score) return "";
  const pct = Math.max(0, Math.min(100, (d.score / 5) * 100));
  const stars = `<span class="stars"><span class="bg">★★★★★</span>` +
    `<span class="fg" style="width:${pct}%">★★★★★</span></span>`;

  const pool = ratingPool();
  let tag = "", note = "";
  if (d.reviews < 30) {
    // 표본이 적으면 평점을 그대로 믿기 어렵다. 감추지 말고 그렇다고 적어준다.
    tag = `<span class="tag thin">표본 적음</span>`;
    note = "리뷰가 아직 적어서 평점이 흔들릴 수 있어요";
  } else if (pool.length >= 30) {
    const better = pool.filter((x) => x.score > d.score).length;
    const rank = Math.max(1, Math.round((better / pool.length) * 100));
    if (rank <= 20) {
      tag = `<span class="tag">평점 상위 ${rank}%</span>`;
      note = `리뷰 30개 이상인 상품 ${won(pool.length)}개 중에서요`;
    }
  }
  return `<div class="rev">
      <div class="row">
        <span class="sc">${d.score.toFixed(1)}</span>
        ${stars}
        <span class="cnt">리뷰 ${won(d.reviews)}개</span>
        ${tag}
      </div>
      ${note ? `<div class="note2">${note}</div>` : ""}
    </div>`;
}

function openSheet(id) {
  const d = CAT.items.find((x) => x.id === id);
  if (!d) return;
  cur = d;
  noteAction(d.id);
  const lo = lowest(d);
  const isSaved = saved.includes(d.id);
  const facts = [];
  if (d.bestRank) facts.push(`<div class="fact"><div class="k">판매 랭킹</div><div class="v">${d.bestRank}위</div></div>`);
  if (d.rankDelta) {
    facts.push(`<div class="fact"><div class="k">${agoLabel(CAT.deltaBaseAt) || "이전 대비"}</div>
      <div class="v ${d.rankDelta > 0 ? "up" : "down"}">${d.rankDelta > 0 ? "▲" : "▼"}${Math.abs(d.rankDelta)}</div></div>`);
  } else if (d.isNew) {
    facts.push(`<div class="fact"><div class="k">랭킹</div><div class="v hot">신규 진입</div></div>`);
  }
  const streak = rankStreakDays(d);
  if (streak >= 2) facts.push(`<div class="fact"><div class="k">100위 안</div><div class="v">${streak}일째</div></div>`);
  if (d.endAt) facts.push(`<div class="fact"><div class="k">남은 시간</div>
    <div class="v hot" data-end="${esc(d.endAt)}" data-cd>${hhmmss(msLeft(d))}</div></div>`);

  $("#sheet").innerHTML = `
    <div class="grab"></div>
    <button class="x" onclick="closeSheet()">✕</button>
    <div class="scroll">
    <div class="hero">${d.img ? `<img src="${esc(d.img)}" alt="">` : ""}</div>
    <div class="body">
      ${d.brand ? `<div class="bd2">${esc(d.brand)}${d.cat ? ` · ${esc(d.cat)}` : ""}</div>` : ""}
      <h3>${esc(d.fullName || d.name)}</h3>
      <div class="price">
        ${d.dc > 0 ? `<span class="dc">${d.dc}%</span>` : ""}
        <span class="won">${won(d.price)}원</span>
        ${d.dc > 0 ? `<span class="orig">${won(d.orig)}원</span>` : ""}
      </div>
      ${facts.length ? `<div class="facts">${facts.join("")}</div>` : ""}
      ${ratingCard(d)}
      ${lo ? `<div class="spark">
          <div class="hd"><span>${lo.flat ? `${lo.days}번 확인 내내 같은 가격이에요`
                                           : (lo.isLow ? "기록상 가장 싼 가격이에요" : "기록된 최저가")}</span>
            <b>${won(lo.min)}원</b></div>
          ${sparkSvg(lo.points)}
        </div>` : ""}
    </div>
    </div>
    <div class="foot">
      <div class="cta">
        <button class="buy ${d.url ? "" : "off"}" onclick="buy()">${d.url ? "토스쇼핑에서 보기" : "구매 링크 준비 중"}</button>
        <button class="ic" onclick="toggleSave()" id="saveBtn">${isSaved ? "❤️" : "♡"}</button>
        <button class="ic" onclick="share()">↗</button>
      </div>
      <div class="note">토스쇼핑으로 이동해 구매가 이뤄지면 운영자에게 일정 수수료가 지급될 수 있어요.</div>
    </div>`;
  $("#dim").classList.add("on");
  $("#sheet").classList.add("on");
  tickCountdowns();
}
function closeSheet() {
  $("#dim").classList.remove("on");
  $("#sheet").classList.remove("on");
  cur = null;
  maybeAskReview();
}
$("#dim").onclick = closeSheet;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && cur) closeSheet(); });

/* 외부 링크 — 토스 앱(앱인토스 WebView)에서는 window.open이 안 먹어 SDK의 openURL을 써야 한다.
   SDK import는 toss-bridge.js가 맡고, 성공하면 window.__tossOpenURL 로 실어준다. */
function openExternal(url) {
  if (!url) return;
  if (typeof window.__tossOpenURL === "function") { window.__tossOpenURL(url); return; }
  window.open(url, "_blank");
}
function buy() {
  if (!cur || !cur.url) { toast("아직 구매 링크가 없어요"); return; }
  const url = cur.url;
  noteAction(cur.id);
  leftForShopping = true;
  toast("토스쇼핑으로 이동해요 →");
  setTimeout(() => openExternal(url), 380);
}
function toggleSave() {
  if (!cur) return;
  const i = saved.indexOf(cur.id);
  if (i >= 0) { saved.splice(i, 1); toast("찜을 해제했어요"); }
  else { saved.push(cur.id); noteAction(cur.id); toast("찜했어요 ❤️"); }
  localStorage.setItem("dealrank.saved", JSON.stringify(saved));
  $("#saveBtn").textContent = saved.includes(cur.id) ? "❤️" : "♡";
  paintSavedCount();
}
function share() {
  if (!cur) return;
  const link = cur.url || location.href;
  const txt = `[오늘만 이 가격] ${cur.name} — ${cur.dc}% 할인, ${won(cur.price)}원`;
  if (navigator.share) navigator.share({ title: "오늘만 이 가격", text: txt, url: link }).catch(() => {});
  else { navigator.clipboard?.writeText(`${txt}\n${link}`); toast("링크를 복사했어요 📋"); }
}
function paintSavedCount() {
  const el = $("#savedCnt");
  el.textContent = saved.length;
  el.classList.toggle("hide", !saved.length);
}

/* ── 카운트다운 ────────────────────────────────────────────── */
function tickCountdowns() {
  document.querySelectorAll("[data-cd]").forEach((el) => {
    const end = el.dataset.end || el.closest("[data-end]")?.dataset.end;
    if (!end) return;
    const left = new Date(end).getTime() - Date.now();
    el.textContent = hhmmss(left);
    if (left < 2 * 3600 * 1000) el.classList.add("soon");
  });
}
setInterval(() => {
  tickCountdowns();
  // 만료된 하루특가는 목록에서 빠져야 한다 — 1분에 한 번만 다시 그린다
  if (Date.now() - (render._last || 0) > 60000 && tab === "today" && !curQ) {
    render._last = Date.now();
    render();
  }
}, 1000);

/* ── 순위 이력 ─────────────────────────────────────────────────
   이 앱만 가진 데이터다. 쉐어링크 API는 "지금 몇 위"만 주고 과거를 주지 않아서,
   sync.py가 실행할 때마다 베스트 100의 순위를 rank-history.json에 스냅샷으로 쌓는다.
   여기서 상품별 시계열로 뒤집어, 추이 그래프와 "며칠째 100위 안" 배지를 만든다. */
let RANK = {};        // id → [{at, r}]  (오래된 것부터)
let RANK_DAYS = [];   // 스냅샷이 있는 날짜들(오래된 것부터, 중복 제거)

function buildRankSeries(hist) {
  RANK = {};
  const snaps = (hist && hist.snapshots) || [];
  RANK_DAYS = [...new Set(snaps.map((s) => (s.at || "").slice(0, 10)))].sort();
  snaps.forEach((s) => {
    Object.entries(s.ranks || {}).forEach(([id, r]) => {
      (RANK[id] || (RANK[id] = [])).push({ at: s.at, r: Number(r) });
    });
  });
}

const rankSeries = (d) => RANK[d.id] || RANK[String(d.tacaItemId)] || [];

// "N일째 100위 안" — 가장 최근 기록일부터 거꾸로 **끊기지 않고** 이어진 날만 센다.
// 그냥 등장한 날을 세면 8/06과 8/14에 한 번씩 뜬 상품이 "2일째"가 되어 거짓말이 된다.
// 하루에 두 번 동기화한 날이 있어서 스냅샷 개수가 아니라 날짜로 센다.
// "달력상 하루씩" 이어져야 N일째라고 말할 수 있다. 집계를 건너뛴 날이 있으면
// (동기화 실패·쿼터 소진) 거기서 끊는다 — 8/07과 8/11을 이어 붙여 "2일째"라고 하면 거짓말이다.
function rankStreakDays(d) {
  const days = new Set(rankSeries(d).map((x) => x.at.slice(0, 10)));
  if (!days.size) return 0;
  const dayNum = (s) => Math.round(Date.parse(`${s}T00:00:00Z`) / 86400000);
  let n = 0;
  let prev = null;
  for (let i = RANK_DAYS.length - 1; i >= 0; i -= 1) {
    const day = RANK_DAYS[i];
    if (!days.has(day)) break;
    if (prev !== null && dayNum(prev) - dayNum(day) !== 1) break;
    prev = day;
    n += 1;
  }
  return n;
}

// 작은 추이 그래프. 순위는 낮을수록 좋으니 y축을 뒤집는다.
function sparkline(d, w, h) {
  const s = rankSeries(d);
  if (s.length < 3) return "";
  const rs = s.map((x) => x.r);
  const min = Math.min(...rs), max = Math.max(...rs);
  const span = Math.max(max - min, 1);
  const pts = rs.map((r, i) => {
    const x = (i / (rs.length - 1)) * (w - 2) + 1;
    const y = ((r - min) / span) * (h - 4) + 2;   // 1위(작은 값)가 위로 오게
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const last = rs[rs.length - 1], first = rs[0];
  const cls = last < first ? "up" : (last > first ? "down" : "flat");
  return `<svg class="rspark ${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${(w - 1).toFixed(1)}" cy="${(((last - min) / span) * (h - 4) + 2).toFixed(1)}" r="1.9"/>
  </svg>`;
}

/* ── 로드 ──────────────────────────────────────────────────── */
async function loadJson(name) {
  if (REMOTE && !IS_LOCAL) {
    const r = await fetch(`${REMOTE}/${name}`, { cache: "no-store" }).catch(() => null);
    if (r && r.ok) return r.json().catch(() => null);
  }
  const r = await fetch(name, { cache: "no-store" }).catch(() => null);
  return r && r.ok ? r.json().catch(() => null) : null;
}

async function boot() {
  const [cat, prices, ranks] = await Promise.all([
    loadJson("catalog.json"), loadJson("price-history.json"), loadJson("rank-history.json"),
  ]);
  PRICES = prices || {};
  buildRankSeries(ranks);

  if (!cat || !cat.items || !cat.items.length) {
    $("#view").innerHTML = emptyBox("아직 데이터가 없어요",
      "터미널에서 <b>python3 sync.py</b> 를 한 번 돌려주세요.", "📦");
    return;
  }
  CAT = cat;

  const t = new Date(cat.updatedAt);
  const stampTxt = `${String(t.getMonth() + 1).padStart(2, "0")}.${String(t.getDate()).padStart(2, "0")} ` +
    `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")} 기준`;
  $("#stamp").innerHTML = `<b>${stampTxt}</b> · 상품 ${won(live().length)}개` +
    (cat.bootstrap ? ` · <span class="warn">임시 데이터</span>` : "");

  $("#cTod").textContent = listToday().length;
  $("#cBes").textContent = listBest().length;
  $("#cRis").textContent = listRising().length;
  // 다른 탭이 전부 상품 수를 세는데 여기만 카테고리 개수(16)를 세고 있었다
  $("#cCat").textContent = live().filter((d) => d.catId).length;

  paintSavedCount();
  paintNoti();
  // 이 앱의 중심은 순위다. 급상승을 첫 화면으로 두고,
  // 스냅샷이 아직 두 번 안 쌓여 급상승이 비는 날에만 베스트로 넘어간다.
  setTab(listRising().length ? "rising" : "best");
}
$("#notiBtn").onclick = requestNoti;
// SDK import는 비동기라 boot()보다 늦게 끝날 수 있다. 준비되면 배너를 다시 판단한다.
window.addEventListener("toss-sdk-ready", paintNoti);

boot();
</script>
<script type="module" src="./toss-bridge.js"></script>
</body>
</html>
